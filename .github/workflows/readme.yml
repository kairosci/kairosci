name: readme

on:
  schedule:
    - cron: "23 */5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "config/**", "templates/**", "mise.toml", "package.json", "aube-lock.yaml", ".github/workflows/readme.yml"]

permissions:
  contents: write

concurrency:
  group: readme

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Regenerate README
        run: |
          mise install
          mise run readme
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit changes
        run: |
          git add README.md assets data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
