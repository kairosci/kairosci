<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-labelledby="t d">
<title id="t">End of profile</title>
<desc id="d">Connection closed.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#8fa3b0}.cy{fill:#5eead4}.fg{fill:#d7e3ea}.gr{fill:#a3e635}.wh{fill:#f2fbf8}.fainter{fill:#3d4c56}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5eead4" stroke-opacity=".06"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M10 -40V110M430 -40V110M10 110H430" fill="none" stroke="#5eead4" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="10" y="0" width="420" height="110" fill="#06121b"/>
<rect x="10" y="0" width="420" height="110" fill="url(#grid)"/>
<text x="28" y="32" class="dim"><tspan class="gr">$</tspan> exit</text>
<text x="28" y="56" class="dim">connection to <tspan class="cy">kairosci</tspan> closed. <tspan class="fainter">// EOF</tspan></text>
<text x="412" y="88" text-anchor="end" class="fainter" style="font-size:11px">// console after @georgekobaidze</text>
<path d="M10 0V110M430 0V110M10 110H430" fill="none" stroke="#5eead4" stroke-width="1.2"/>
<g fill="none" stroke="#5eead4" stroke-width="2"><path d="M3 92V117H28"/><path d="M412 117H437V92"/></g>
</svg>