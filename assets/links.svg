<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-labelledby="t d">
<title id="t">links</title>
<desc id="d">links</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#8fa3b0}.cy{fill:#5eead4}.fg{fill:#d7e3ea}.gr{fill:#a3e635}.wh{fill:#f2fbf8}.fainter{fill:#3d4c56}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5eead4" stroke-opacity=".06"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M16 -40V160M864 -40V160" fill="none" stroke="#5eead4" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="120" fill="#06121b"/>
<rect x="16" y="0" width="848" height="120" fill="url(#grid)"/>
<text x="52" y="44" font-weight="700" fill="#5eead4" filter="url(#g)" opacity=".8" style="font-size:20px">~/</text>
<text x="52" y="44" font-weight="700" style="font-size:20px"><tspan class="cy">~/</tspan><tspan class="wh">links</tspan></text>
<text x="828" y="44" text-anchor="end" letter-spacing="2" fill="#647884" style="font-size:12px">// 01</text>
<line x1="52" y1="58" x2="828" y2="58" stroke="#5eead4" stroke-opacity=".4"/>
<line x1="52" y1="58" x2="172" y2="58" stroke="#5eead4" stroke-width="2"/>
<line x1="52" y1="58" x2="172" y2="58" stroke="#5eead4" stroke-width="3" filter="url(#gl)"/>
<g class="ln" style="animation-delay:0.15s"><text x="52" y="96" class="dim"><tspan class="gr">$</tspan> ping kairosci --all-channels <tspan class="fainter"></tspan></text></g>
<path d="M16 0V120M864 0V120" fill="none" stroke="#5eead4" stroke-width="1.2"/>
<g fill="none" stroke="#5eead4" stroke-width="2"></g>
</svg>