[tools]
node = "26"
aube = "2.6"

[tasks.install]
description = "install node dependencies"
run = "aube install --frozen-lockfile"
sources = ["package.json", "aube-lock.yaml"]
outputs = { auto = true }

[tasks.typecheck]
description = "typecheck sources with strict tsc"
depends = ["install"]
run = "npx tsc --noEmit"

[tasks.fetch]
description = "fetch projects and counts into data/"
depends = ["install"]
run = "node src/fetch.ts"
sources = ["config/profile.yml", "src/fetch.ts", "src/fetch/**/*.ts", "src/schemas.ts", "src/profile.ts", "src/defined.ts"]
outputs = ["data/snapshot.json", "data/calendar.json", "data/stars.json"]

[tasks.render]
description = "render assets/*.svg and README.md from data/"
depends = ["install"]
run = "node src/render.ts"
sources = ["data/snapshot.json", "data/calendar.json", "data/stars.json", "config/*.yml", "src/**/*.ts", "templates/**/*"]
outputs = ["assets", "README.md"]

[tasks.readme]
description = "fetch fresh data and regenerate the profile README"
depends = ["fetch"]
run = "node src/render.ts"

[tasks.check]
description = "typecheck and render from cached data"
depends = ["typecheck", "render"]
