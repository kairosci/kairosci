<rect x="{{fl}}" y="{{m}}" width="{{barW}}" height="34" fill="{{accent}}" fill-opacity=".08"/>
<line x1="{{fl}}" y1="{{barY}}" x2="{{fr}}" y2="{{barY}}" stroke="{{accent}}" stroke-opacity=".35"/>
<text x="{{barLX}}" y="{{barLY}}" letter-spacing="1" class="cy" style="font-size:12px">{{barLeft}}</text>
<text x="{{barRX}}" y="{{barLY}}" letter-spacing="1" class="dim" text-anchor="end" style="font-size:12px">{{barRight}}</text>
<circle class="dot" cx="{{dotx}}" cy="{{dotY}}" r="4" fill="{{ok}}"/>
<g clip-path="url(#typeclip)"><text x="{{x}}" y="{{whoY}}" class="dim"><tspan class="gr">$</tspan> whoami</text></g>
<g class="name" font-weight="800" letter-spacing="{{nameSpacing}}" style="font-size:{{nameSize}}px">
<text x="{{x}}" y="{{nameY}}" fill="{{bright}}">{{name}}</text>
</g>
{{descLines}}
