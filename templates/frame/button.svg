<g class="ln" style="animation-delay:{{delay}}s">
<path d="{{box}}" fill="{{accent}}" fill-opacity=".05"/>
<path d="{{box}}" fill="none" stroke="{{accent}}" stroke-opacity=".55"/>
<path d="{{cutLine}}" stroke="{{accent}}" stroke-width="2"/>
<g transform="translate({{iconX}} {{iconY}})"><g filter="url(#g)" opacity=".5">{{icon}}</g>{{icon}}</g>
<text x="{{labelX}}" y="{{labelY}}" font-weight="700" class="cy" style="font-size:13px">{{label}}</text>
<text x="{{handleX}}" y="{{handleY}}" class="dim" style="font-size:10px">{{handle}}</text>
</g>
