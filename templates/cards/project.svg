<g transform="translate({{logoX}} {{logoY}})">{{logoImg}}</g>
<text x="{{nx}}" y="{{nameY}}" font-weight="700" class="cy" style="font-size:{{nameSize}}px">{{name}}</text>
<path d="M{{arrowX}} {{arrowY}}l7-7M{{arrowX2}} {{arrowY2}}h5v5" fill="none" stroke="{{accent}}" stroke-width="1.5"/>
<rect x="{{tx}}" y="{{tagY}}" width="{{tagW}}" height="16" fill="none" stroke="{{tagc}}" stroke-opacity=".8"/>
<text x="{{tagTX}}" y="{{tagTY}}" letter-spacing="1" fill="{{tagc}}" style="font-size:11px">{{tag}}</text>
<path transform="translate({{starX}} {{starY}}) scale(.5)" d="M10 0l2.9 6.6 7.1.6-5.4 4.7 1.6 7L10 15.2 3.8 18.9l1.6-7L0 7.2l7.1-.6z" fill="{{star}}"/>
<text x="{{sx}}" y="{{tagTY}}" text-anchor="end" class="dim" style="font-size:12px">{{stars}}</text>
{{desc}}
{{install}}
