<g class="ln" style="animation-delay:{{delay}}s">
<path d="{{box}}" fill="{{accent}}" fill-opacity=".035"/>
<path d="{{box}}" fill="none" stroke="{{accent}}" stroke-opacity=".4"/>
<path d="{{cutLine}}" stroke="{{accent}}" stroke-width="2"/>
<g transform="translate({{logoX}} {{logoY}})">{{logoImg}}</g>
<text x="{{nx}}" y="{{nameY}}" font-weight="700" fill="{{accent}}" filter="url(#g)" opacity=".6" style="font-size:17px">{{name}}</text>
<text x="{{nx}}" y="{{nameY}}" font-weight="700" class="cy" style="font-size:17px">{{name}}</text>
<path d="M{{arrowX}} {{arrowY}}l8-8M{{arrowX2}} {{arrowY2}}h6v6" fill="none" stroke="{{accent}}" stroke-width="1.6"/>
<rect x="{{tx}}" y="{{tagY}}" width="{{tagW}}" height="18" fill="none" stroke="{{tagc}}" stroke-opacity=".8"/>
<text x="{{tagTX}}" y="{{tagTY}}" letter-spacing="1" fill="{{tagc}}" style="font-size:11px">{{tag}}</text>
{{desc}}
<text x="{{tx}}" y="{{instY}}" class="dim" style="font-size:12px"><tspan class="gr">$</tspan> {{install}}</text>
<path transform="translate({{starX}} 158) scale(.55)" d="M10 0l2.9 6.6 7.1.6-5.4 4.7 1.6 7L10 15.2 3.8 18.9l1.6-7L0 7.2l7.1-.6z" fill="{{star}}"/>
<text x="{{sx}}" y="{{instY}}" text-anchor="end" class="dim" style="font-size:12px">{{stars}}</text>
</g>
