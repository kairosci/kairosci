<g class="ln" style="animation-delay:{{delay}}s">
<rect x="{{stripeX}}" y="2" width="{{stripeW}}" height="36" fill="{{accent}}" fill-opacity="{{stripe}}"/>
<text x="{{x}}" y="{{nameY}}" font-weight="700" fill="{{color}}" style="font-size:{{nameSize}}px">{{name}}</text>
{{chip}}
<text x="{{x}}" y="{{pitchY}}" class="dim" style="font-size:{{pitchSize}}px">{{pitch}}</text>
<rect x="{{bx}}" y="{{trackY}}" width="{{bw}}" height="{{barH}}" fill="{{well}}"/>
<g class="bar" style="animation-delay:{{barDelay}}s">
<rect x="{{bx}}" y="{{trackY}}" width="{{w}}" height="{{barH}}" fill="{{color}}"/>
</g>
<text class="lbl" x="{{lblX}}" y="{{lblY}}" font-weight="700" fill="{{color}}" style="font-size:13px;animation-delay:{{lblDelay}}s">+{{gain}}</text>
<g fill="{{color}}" opacity=".75">{{hist}}</g>
{{total}}
</g>
